<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0E262E"><title>Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--deep:#0E262E;--deep2:#17414B;--brass:#D2A06A;--paper:#F4F1EC;--ink:#1C2326;--mut:#6B7478;--line:#E2DDD5;--card:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:16px/1.4 Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto}
.hero{position:relative;overflow:hidden;color:#F3EEE6;background:radial-gradient(120% 90% at 100% 0%,#24606B 0%,transparent 55%),linear-gradient(165deg,var(--deep2),var(--deep) 70%);padding:calc(env(safe-area-inset-top) + 20px) 22px 26px;border-radius:0 0 28px 28px;box-shadow:0 18px 40px -20px rgba(14,38,46,.55)}
.arcs{position:absolute;right:-90px;top:-70px;width:300px;height:300px;opacity:.22;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;height:24px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,238,230,.62)}
.logo{width:24px;height:24px}
.date{margin-top:38px;font-size:13px;color:var(--brass);letter-spacing:.04em}
h1{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:38px;line-height:1.08;letter-spacing:-.015em;margin-top:6px}
h1 em{font-style:normal;font-weight:600}
.line{margin-top:12px;font-size:16px;color:rgba(243,238,230,.78);max-width:30ch}
.glance{display:grid;grid-template-columns:repeat(3,1fr);margin-top:24px;border-top:1px solid rgba(243,238,230,.14);padding-top:16px}
.glance div{font-size:12px;color:rgba(243,238,230,.6)}
.glance b{display:block;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:28px;color:#F3EEE6;line-height:1.1}
.glance div:first-child b{color:var(--brass)}
.body{padding:22px 16px 110px}
.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:4px 6px 12px}
.card{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 1px 0 rgba(0,0,0,.03),0 10px 24px -14px rgba(14,38,46,.28);text-decoration:none;color:inherit;min-height:84px}
.av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:16px;color:#fff;background:linear-gradient(145deg,#2F6B76,#0E262E)}
.av.b{background:linear-gradient(145deg,#C8955B,#8A5E33)}
.who{flex:1;min-width:0}.who b{display:block;font-size:17px;font-weight:600}
.who .tag{font-size:11px;font-weight:500;color:#8A5E33;background:#F5E9DA;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.who>span{display:block;font-size:15px;color:var(--mut);margin-top:2px}
.act{flex:none;font-size:14px;font-weight:600;color:var(--deep);background:#E8EFEF;border-radius:999px;padding:10px 14px}
.calm{display:flex;gap:12px;align-items:center;margin:18px 6px 0;padding:16px;border:1px dashed #CFC8BD;border-radius:18px;font-size:15px;color:var(--mut)}
.calm i{flex:none;width:28px;height:28px;border-radius:50%;background:#E3ECE9;display:grid;place-items:center}
.calm i:after{content:"";width:9px;height:5px;border-left:2px solid #2F6B76;border-bottom:2px solid #2F6B76;transform:rotate(-45deg) translate(1px,-1px)}
.calm b{color:var(--ink);font-weight:600}
.rest{margin:28px 6px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rest a{padding:14px;border-radius:14px;background:#ECE7DF;color:var(--ink);text-decoration:none;font-size:15px}
.cap{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);background:var(--deep);color:#F3EEE6;border-radius:999px;padding:14px 22px;font-weight:600;font-size:15px;text-decoration:none;box-shadow:0 12px 28px -10px rgba(14,38,46,.6)}
.anim .s{opacity:0;animation:up .45s cubic-bezier(.2,.7,.2,1) forwards}
.anim .arcs{animation:spin 2.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{from{transform:rotate(-40deg);opacity:0}to{transform:none;opacity:.22}}
.anim .glance b{animation:none}
.skip *{animation-delay:0s!important;animation-duration:.01s!important}
@media(prefers-reduced-motion:reduce){.anim *{animation:none!important;opacity:1!important;transform:none!important}}
@media(min-width:900px){body{background:linear-gradient(180deg,var(--deep) 0 330px,var(--paper) 330px)}.wrap{padding-top:40px}.hero{border-radius:28px}.body{padding-top:26px}}
</style></head><body><div class="wrap" id="m">
<section class="hero">
<svg class="arcs" viewBox="0 0 300 300" fill="none" stroke="#F3EEE6" stroke-width="1"><circle cx="150" cy="150" r="140"/><circle cx="150" cy="150" r="112"/><circle cx="150" cy="150" r="84" stroke-dasharray="3 7"/><circle cx="150" cy="150" r="56"/><path d="M10 150h280M150 10v280" stroke-opacity=".5"/></svg>
<div class="top"><span class="logo" aria-hidden="true"></span><span id="biz">Winterhalter</span></div>
<div class="date s" style="animation-delay:.15s" id="dt"></div>
<h1 class="s" style="animation-delay:.3s" id="g"></h1>
<p class="line s" style="animation-delay:.8s">When a machine stops, a kitchen stops. Here’s who needs you today.</p>
<div class="glance s" style="animation-delay:1.3s" id="gl"></div>
</section>
<section class="body">
<div class="lab s" style="animation-delay:1.7s">Needs you</div>
<div id="cards"></div>
<div class="calm s" id="calm"></div>
<nav class="rest s" style="animation-delay:3s"><a href="/#/inbox">Inbox</a><a href="/#/tasks">Tasks</a><a href="/#/calendar">Calendar</a><a href="/#/followups">Follow-ups</a></nav>
</section></div>
<a class="cap s" style="animation-delay:3s" href="/#/tasks">Capture</a>
<script>
(function(){
/* Work-only snapshot, 26 Oct. Titles only, no message bodies. */
var D={first:'Gareth',tz:'Asia/Dubai',workToday:6,meetings:0,
 people:[{name:'Peter',key:true,want:'Waiting on a call back',act:'Call back',href:'/#/inbox'},
         {name:'Mohamed Hagag',want:'Purchase orders T2, T4 and T5 to release',act:'Review',href:'/#/inbox'}]};
var anim=!sessionStorage.getItem('lr_m2')||location.search.indexOf('replay')>-1;sessionStorage.setItem('lr_m2','1');
var m=document.body;if(anim)m.classList.add('anim');addEventListener('pointerdown',function(){m.classList.add('skip')},{once:true});
var $=function(i){return document.getElementById(i)},e=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var now=new Date(),h=+now.toLocaleString('en-GB',{timeZone:D.tz,hour:'2-digit',hour12:false});
$('dt').textContent=now.toLocaleDateString('en-GB',{timeZone:D.tz,weekday:'long',day:'numeric',month:'long'});
$('g').innerHTML=(h<12?'Good morning':h<17?'Good afternoon':'Good evening')+',<br><em>'+e(D.first)+'.</em>';
var n=D.people.length,sorted=D.workToday-D.people.reduce(function(a,p){return a+0},0);
$('gl').innerHTML='<div><b>'+n+'</b>'+(n===1?'person needs':'people need')+' you</div><div><b>'+D.meetings+'</b>meetings today</div><div><b>'+D.workToday+'</b>work messages read</div>';
$('cards').innerHTML=D.people.slice(0,3).map(function(p,i){var ini=p.name.split(' ').map(function(w){return w[0]}).join('').slice(0,2);
 return '<a class="card s" href="'+p.href+'" style="animation-delay:'+(1.9+i*.18)+'s"><span class="av'+(p.key?' b':'')+'">'+e(ini)+'</span><span class="who"><b>'+e(p.name)+(p.key?'<span class="tag">Key contact</span>':'')+'</b><span>'+e(p.want)+'</span></span><span class="act">'+e(p.act)+'</span></a>'}).join('');
var c=$('calm');c.style.animationDelay=(1.9+n*.18+.2)+'s';
c.innerHTML='<i></i><span><b>Everything else is handled.</b> '+D.workToday+' work messages today, all read — only these '+n+' need you. No meetings, so the day’s yours.</span>';
})();
</script></body></html>
